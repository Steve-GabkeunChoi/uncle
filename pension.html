<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>버닝엉클</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tossBlue: '#3182f6',
                        tossBlueLight: '#e8f3ff',
                        tossGray50: '#f9fafb',
                        tossGray100: '#f2f4f6',
                        tossGray200: '#e5e8eb',
                        tossGray600: '#4e5968',
                        tossGray800: '#333d4b',
                        tossGray900: '#191f28',
                        brandRed: '#ff5c35',
                        brandRedLight: '#fff0ec',
                        tossSuccess: '#00c73c',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            letter-spacing: -0.03em;
            background-color: #f2f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .toss-transition {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .animate-screen-in {
            animation: screenIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes screenIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 모바일 브라우저 주소창 스크롤 대응 스크린 래퍼 */
        .safe-screen-height {
            height: 100vh;
            height: -webkit-fill-available;
        }
    </style>
</head>
<body class="w-full min-h-screen text-tossGray900 select-none bg-tossGray100 overflow-x-hidden md:overflow-hidden">

    <div id="toast-hub" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-[calc(100%-2rem)] max-w-sm pointer-events-none"></div>

    <div id="app-root" class="w-full min-h-screen"></div>

    <script>
        // ================================================================= -->
        // 1. 비즈니스 중심 글로벌 상태 매니지먼트 (Core State)
        // ================================================================= -->
        const coreState = {
            currentUser: null,
            currentView: 'dashboard',
            
            rooms: [
                { id: '101호 (Family 독채)', status: 'occupied', price: 350000, cleaner: '김숙자 매니저' },
                { id: '102호 (Ocean View)', status: 'dirty', price: 280000, cleaner: '이정희 매니저' },
                { id: '103호 (Forest Cabin)', status: 'empty', price: 240000, cleaner: '배정 담당 없음' },
                { id: '201호 (Standard)', status: 'occupied', price: 180000, cleaner: '김숙자 매니저' },
                { id: '202호 (Standard Premium)', status: 'occupied', price: 220000, cleaner: '이정희 매니저' },
                { id: '203호 (Suite Master)', status: 'empty', price: 420000, cleaner: '배정 담당 없음' },
                { id: '301호 (Glamping Wood)', status: 'dirty', price: 150000, cleaner: '박정철 매니저' },
                { id: '302호 (Glamping Fire)', status: 'occupied', price: 150000, cleaner: '박정철 매니저' },
                { id: '303호 (Penthouse VIP)', status: 'empty', price: 650000, cleaner: '마스터 총괄' }
            ],

            reservations: [
                { id: 1001, email: 'customer@uncle.com', room: '101호 (Family 독채)', checkIn: '2026-05-18', checkOut: '2026-05-20', guestName: '김토스', price: 700000, status: '이용 중' },
                { id: 1002, email: 'customer@uncle.com', room: '201호 (Standard)', checkIn: '2026-05-22', checkOut: '2026-05-24', guestName: '김토스', price: 360000, status: '결제 완료' }
            ],

            bbqOrders: [
                { id: 1, room: '101호 (Family 독채)', item: '🔥 강원 참나무 참숯 바비큐 세트 (2~3인)', time: '18:30 배달 요청', status: '접수 대기' },
                { id: 2, room: '201호 (Standard)', item: '🧺 교체용 코튼 타월 & 어메니티 세트', time: '즉시 요청', status: '준비 중' }
            ],

            statusMeta: {
                empty: { text: '정비 완료 (공실)', class: 'text-tossSuccess bg-green-50 border-green-100', next: 'occupied' },
                occupied: { text: '투숙 이용 중', class: 'text-tossBlue bg-tossBlueLight border-blue-100', next: 'dirty' },
                dirty: { text: '퇴실 (정비 요망)', class: 'text-brandRed bg-brandRedLight border-red-100', next: 'empty' }
            }
        };

        function syncRouteView() {
            const root = document.getElementById('app-root');
            if (!coreState.currentUser) {
                root.innerHTML = renderAuthLayout();
            } else {
                root.innerHTML = renderMainLayout();
                renderActiveSubView();
            }
        }

        // ================================================================= -->
        // 2. 모바일 반응형 사용자 인증 인터페이스 레이아웃 (로그인/회원가입)
        // ================================================================= -->
        let authFormMode = 'login'; 

        function renderAuthLayout() {
            return `
                <div class="w-full min-h-screen bg-tossGray100 flex items-center justify-center p-4 sm:p-8 animate-screen-in">
                    <div class="bg-white rounded-[24px] sm:rounded-[32px] w-full max-w-md p-6 sm:p-10 shadow-sm border border-tossGray200/60 space-y-6 sm:space-y-8">
                        <div class="flex flex-col items-center gap-2">
                            <div class="w-12 h-12 bg-brandRedLight rounded-full flex items-center justify-center mb-1">
                                <i class="fa-solid fa-fire text-brandRed text-2xl"></i>
                            </div>
                            <h2 class="text-xl sm:text-2xl font-black tracking-tight">${authFormMode === 'login' ? '버닝엉클 로그인' : '스마트 운영 계정 등록'}</h2>
                            <p class="text-xs font-semibold text-tossGray600 text-center">강원 프리미엄 독채 스테이 통합 관리 시스템</p>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-tossGray600 mb-1.5">이메일 계정</label>
                                <input type="email" id="inp-email" placeholder="name@burninguncle.com" class="w-full bg-tossGray50 border border-tossGray200 px-4 py-3 sm:py-3.5 rounded-xl sm:rounded-2xl outline-none focus:border-tossBlue font-medium transition-all text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-tossGray600 mb-1.5">비밀번호</label>
                                <input type="password" id="inp-password" placeholder="••••••••" class="w-full bg-tossGray50 border border-tossGray200 px-4 py-3 sm:py-3.5 rounded-xl sm:rounded-2xl outline-none focus:border-tossBlue font-medium transition-all text-sm">
                            </div>
                            ${authFormMode === 'signup' ? `
                            <div class="animate-screen-in space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-tossGray600 mb-1.5">이름 또는 담당자 성명</label>
                                    <input type="text" id="inp-username" placeholder="홍길동" class="w-full bg-tossGray50 border border-tossGray200 px-4 py-3 sm:py-3.5 rounded-xl sm:rounded-2xl outline-none focus:border-tossBlue font-medium transition-all text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-tossGray600 mb-1.5">계정 권한 그룹</label>
                                    <select id="inp-role" class="w-full bg-tossGray50 border border-tossGray200 px-4 py-3 sm:py-3.5 rounded-xl sm:rounded-2xl outline-none focus:border-tossBlue font-bold text-xs sm:text-sm">
                                        <option value="customer">투숙 고객 전용 계정 (실시간 스테이 예약/주문 데스크)</option>
                                        <option value="admin">현장 총괄 관리자 계정 (통합 관제 대시보드 권한)</option>
                                    </select>
                                </div>
                            </div>
                            ` : ''}
                        </div>

                        <div class="space-y-3 pt-2">
                            <button onclick="executeAuthAction()" class="w-full bg-tossBlue hover:bg-blue-600 text-white font-bold py-3.5 sm:py-4 rounded-xl sm:rounded-2xl text-[14px] sm:text-[15px] shadow-sm toss-transition">
                                ${authFormMode === 'login' ? '로그인' : '운영 원장 등록 완료'}
                            </button>
                            <button onclick="switchAuthFormMode()" class="w-full text-center text-xs font-bold text-tossGray600 hover:text-tossGray900 block py-1">
                                ${authFormMode === 'login' ? '아직 운영 계정이 없으신가요? 회원가입' : '이미 등록된 관리 계정이 있습니다? 로그인'}
                            </button>
                        </div>

                        <div class="p-3.5 bg-tossGray50 rounded-xl sm:rounded-2xl text-[11px] text-tossGray600 font-medium leading-relaxed">
                            💡 <b>테스트 계정 가이드:</b><br>
                            - 현장 총괄 관리자: <span class="font-bold text-tossBlue">admin@uncle.com</span> / 비번: <span class="font-bold text-tossBlue">1234</span><br>
                            - 일반 투숙 고객 계정: <span class="font-bold text-brandRed">customer@uncle.com</span> / 비번: <span class="font-bold text-brandRed">1234</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================================================================= -->
        // 3. 글로벌 메인 레이아웃 프레임 (데스크톱 사이드바 ↔ 모바일 바텀내브 분기)
        // ================================================================= -->
        function renderMainLayout() {
            const user = coreState.currentUser;
            const isAdmin = user.role === 'admin';

            return `
                <div class="w-full min-h-screen flex flex-col md:flex-row bg-tossGray100 animate-screen-in pb-20 md:pb-0">
                    
                    <aside class="hidden md:flex w-72 bg-white border-r border-tossGray200 flex-col justify-between py-10 px-6 h-screen flex-shrink-0">
                        <div class="space-y-10">
                            <div class="flex items-center gap-3 px-3">
                                <div class="w-10 h-10 bg-brandRedLight rounded-full flex items-center justify-center">
                                    <i class="fa-solid fa-fire text-brandRed text-xl"></i>
                                </div>
                                <div>
                                    <h1 class="text-xl font-black text-tossGray900 leading-tight">BurningUncle</h1>
                                    <span class="text-[11px] font-bold text-tossGray600 uppercase tracking-wider">Premium Cabin Space</span>
                                </div>
                            </div>

                            <nav class="space-y-1.5">
                                ${isAdmin ? `
                                    <button onclick="handleViewSwitch('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-4 px-4 py-3.5 text-left rounded-2xl text-[15px] font-bold text-tossGray600 hover:bg-tossGray50 toss-transition"><i class="fa-solid fa-chart-pie text-lg w-6"></i>현장 종합 관제 대시보</button>
                                    <button onclick="handleViewSwitch('timeline')" id="nav-timeline" class="w-full flex items-center gap-4 px-4 py-3.5 text-left rounded-2xl text-[15px] font-bold text-tossGray600 hover:bg-tossGray50 toss-transition"><i class="fa-solid fa-calendar-days text-lg w-6"></i>실시간 예약 및 투숙 관리</button>
                                    <button onclick="handleViewSwitch('bbq')" id="nav-bbq" class="w-full flex items-center gap-4 px-4 py-3.5 text-left rounded-2xl text-[15px] font-bold text-tossGray600 hover:bg-tossGray50 toss-transition"><i class="fa-solid fa-fire-burner text-lg w-6"></i>바비큐 & 현장 오더 케어</button>
                                    <button onclick="handleViewSwitch('sales')" id="nav-sales" class="w-full flex items-center gap-4 px-4 py-3.5 text-left rounded-2xl text-[15px] font-bold text-tossGray600 hover:bg-tossGray50 toss-transition"><i class="fa-solid fa-receipt text-lg w-6"></i>투숙 매출 정산 리포트</button>
                                    <button onclick="handleViewSwitch('customers')" id="nav-customers" class="w-full flex items-center gap-4 px-4 py-3.5 text-left rounded-2xl text-[15px] font-bold text-tossGray600 hover:bg-tossGray50 toss-transition"><i class="fa-solid fa-user-gear text-lg w-6"></i>CRM 우수 고객 요약 원장</button>
                                    <button onclick="handleViewSwitch('settings')" id="nav-settings" class="w-full flex items-center gap-4 px-4 py-3.5 text-left rounded-2xl text-[15px] font-bold text-tossGray600 hover:bg-tossGray50 toss-transition"><i class="fa-solid fa-sliders text-lg w-6"></i>환경 설정</button>
                                ` : `
                                    <button onclick="handleViewSwitch('timeline')" id="nav-timeline" class="w-full flex items-center gap-4 px-4 py-3.5 text-left rounded-2xl text-[15px] font-bold text-tossGray600 hover:bg-tossGray50 toss-transition"><i class="fa-solid fa-calendar-check text-lg w-6"></i>실시간 펜션 스테이 예약</button>
                                    <button onclick="handleViewSwitch('bbq')" id="nav-bbq" class="w-full flex items-center gap-4 px-4 py-3.5 text-left rounded-2xl text-[15px] font-bold text-tossGray600 hover:bg-tossGray50 toss-transition"><i class="fa-solid fa-utensils text-lg w-6"></i>현장 서비스 요청</button>
                                `}
                            </nav>
                        </div>

                        <div class="bg-tossGray50 rounded-2xl p-4 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-tossBlue rounded-full flex items-center justify-center text-white font-black text-sm">
                                    ${user.username.substring(0,2).toUpperCase()}
                                </div>
                                <div>
                                    <p class="text-[14px] font-bold text-tossGray900 truncate max-w-[120px]">${user.username}</p>
                                    <span class="text-[11px] font-bold text-tossGray600">${isAdmin ? '총괄 매니저' : '투숙 VIP 고객'}</span>
                                </div>
                            </div>
                            <button onclick="executeLogout()" class="text-tossGray600 hover:text-brandRed p-2 rounded-xl hover:bg-tossGray200/50 toss-transition">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                            </button>
                        </div>
                    </aside>

                    <header class="flex md:hidden w-full h-16 bg-white border-b border-tossGray200 items-center justify-between px-4 flex-shrink-0 sticky top-0 z-40">
                        <div class="flex items-center gap-2">
                            <div class="w-7 Executive w-7 h-7 bg-brandRedLight rounded-full flex items-center justify-center">
                                <i class="fa-solid fa-fire text-brandRed text-sm"></i>
                            </div>
                            <span class="text-base font-black text-tossGray900 tracking-tight">BurningUncle</span>
                        </div>
                        <button onclick="executeLogout()" class="text-xs font-bold text-tossGray600 bg-tossGray100 px-3 py-1.5 rounded-lg">
                            로그아웃 <i class="fa-solid fa-arrow-right-from-bracket ml-1"></i>
                        </button>
                    </header>

                    <div class="flex-1 flex flex-col h-auto md:h-screen overflow-x-hidden md:overflow-hidden">
                        <header class="hidden md:flex h-20 bg-white border-b border-tossGray200 items-center justify-between px-10 flex-shrink-0">
                            <div class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-tossSuccess animate-ping"></span>
                                <span class="text-xs font-bold text-tossGray800">강원 삼척 스테이 실시간 오퍼레이션 채널 연동 중</span>
                            </div>
                            <span class="text-xs font-bold text-tossBlue bg-tossBlueLight px-4 py-2 rounded-full">환영합니다, ${user.username} 매니저님</span>
                        </header>

                        <div id="sub-workspace-viewport" class="flex-1 overflow-y-auto px-4 py-6 md:px-10 md:py-8"></div>
                    </div>

                    <nav class="flex md:hidden fixed bottom-0 left-0 right-0 h-16 bg-white border-t border-tossGray200 items-center justify-around z-40 px-2 shadow-lg">
                        ${isAdmin ? `
                            <button onclick="handleViewSwitch('dashboard')" id="m-nav-dashboard" class="flex flex-col items-center gap-1 text-tossGray600 text-[10px] font-bold w-12"><i class="fa-solid fa-chart-pie text-lg"></i>홈</button>
                            <button onclick="handleViewSwitch('timeline')" id="m-nav-timeline" class="flex flex-col items-center gap-1 text-tossGray600 text-[10px] font-bold w-12"><i class="fa-solid fa-calendar-days text-lg"></i>예약원장</button>
                            <button onclick="handleViewSwitch('bbq')" id="m-nav-bbq" class="flex flex-col items-center gap-1 text-tossGray600 text-[10px] font-bold w-12"><i class="fa-solid fa-fire-burner text-lg"></i>룸오더</button>
                            <button onclick="handleViewSwitch('sales')" id="m-nav-sales" class="flex flex-col items-center gap-1 text-tossGray600 text-[10px] font-bold w-12"><i class="fa-solid fa-receipt text-lg"></i>정산</button>
                            <button onclick="handleViewSwitch('customers')" id="m-nav-customers" class="flex flex-col items-center gap-1 text-tossGray600 text-[10px] font-bold w-12"><i class="fa-solid fa-user-gear text-lg"></i>CRM</button>
                        ` : `
                            <button onclick="handleViewSwitch('timeline')" id="m-nav-timeline" class="flex flex-col items-center gap-1 text-tossGray600 text-[11px] font-bold w-24"><i class="fa-solid fa-calendar-check text-xl"></i>스테이 예약</button>
                            <button onclick="handleViewSwitch('bbq')" id="m-nav-bbq" class="flex flex-col items-center gap-1 text-tossGray600 text-[11px] font-bold w-24"><i class="fa-solid fa-utensils text-xl"></i>현장 서포트 요청</button>
                        `}
                    </nav>
                </div>
            `;
        }

        // ================================================================= -->
        // 4. 모바일 최적화 하위 서브 컴포넌트 뷰 템플릿 빌더
        // ================================================================= -->
        function renderActiveSubView() {
            const viewport = document.getElementById('sub-workspace-viewport');
            if(!viewport) return;

            // 사이드바 하이라이트 공통 세팅
            const allNavIds = ['dashboard', 'timeline', 'bbq', 'sales', 'customers', 'settings'];
            allNavIds.forEach(id => {
                const dBtn = document.getElementById(`nav-${id}`);
                const mBtn = document.getElementById(`m-nav-${id}`);
                if(dBtn) dBtn.className = "w-full flex items-center gap-4 px-4 py-3.5 text-left rounded-2xl text-[15px] font-bold text-tossGray600 hover:bg-tossGray50 toss-transition";
                if(mBtn) mBtn.className = "flex flex-col items-center gap-1 text-tossGray600 text-[10px] md:text-[11px] font-bold w-12 toss-transition";
            });

            const dActive = document.getElementById(`nav-${coreState.currentView}`);
            const mActive = document.getElementById(`m-nav-${coreState.currentView}`);
            if(dActive) dActive.className = "w-full flex items-center gap-4 px-4 py-3.5 text-left rounded-2xl text-[15px] font-bold text-tossBlue bg-tossBlueLight toss-transition";
            if(mActive) mActive.className = "flex flex-col items-center gap-1 text-tossBlue text-[10px] md:text-[11px] font-bold w-12 toss-transition";

            if (coreState.currentView === 'dashboard') viewport.innerHTML = buildDashboardHtml();
            else if (coreState.currentView === 'timeline') viewport.innerHTML = buildTimelineHtml();
            else if (coreState.currentView === 'bbq') viewport.innerHTML = buildBbqHtml();
            else if (coreState.currentView === 'sales') viewport.innerHTML = buildSalesHtml();
            else if (coreState.currentView === 'customers') viewport.innerHTML = buildCustomersHtml();
            else if (coreState.currentView === 'settings') viewport.innerHTML = buildSettingsHtml();
        }

        // 1) 종합 대시보드 컴포넌트 (모바일 1열 카드뷰 구조화)
        function buildDashboardHtml() {
            let occ = 0, emp = 0, cln = 0;
            coreState.rooms.forEach(r => {
                if(r.status === 'occupied') occ++;
                else if(r.status === 'empty') emp++;
                else if(r.status === 'dirty') cln++;
            });

            let matrixCards = coreState.rooms.map((r, i) => {
                const meta = coreState.statusMeta[r.status];
                return `
                    <div onclick="executeRotateStatus(${i})" class="bg-white p-5 rounded-2xl border border-tossGray200/50 hover:shadow-sm active:scale-[0.99] toss-transition cursor-pointer flex flex-col justify-between h-36">
                        <div class="flex justify-between items-start">
                            <span class="font-extrabold text-base text-tossGray900">${r.id}</span>
                            <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-lg ${meta.class}">${meta.text}</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <span class="text-[11px] text-tossGray600 font-bold"><i class="fa-solid fa-user-gear mr-1"></i>${r.cleaner.split(' ')[0]}</span>
                            <span class="text-[10px] text-tossBlue font-black bg-tossBlueLight px-2 py-1 rounded-md">상태 전환</span>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-6 animate-screen-in">
                    <div class="px-1">
                        <h2 class="text-2xl md:text-3xl font-black tracking-tight text-tossGray900">현장 오퍼레이션 상황판</h2>
                        <p class="text-xs md:text-sm font-medium text-tossGray600 mt-1">오늘 당일의 객실 정비 관리판입니다.</p>
                    </div>

                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white rounded-2xl p-4 border border-tossGray200/40 shadow-sm">
                            <span class="text-[11px] font-bold text-tossGray600">총 캐빈수</span>

        function switchAuthFormMode() {
            authFormMode = (authFormMode === 'login') ? 'signup' : 'login';
            syncRouteView();
        }

        function executeAuthAction() {
            const email = document.getElementById('inp-email').value.trim();
            const password = document.getElementById('inp-password').value;

            if(!email || !password) {
                showToast('❌ 계정과 비밀번호 공백 입력을 불허합니다.');
                return;
            }

            let db = JSON.parse(localStorage.getItem('BU_USERS_DB')) || [];

            if (authFormMode === 'signup') {
                const username = document.getElementById('inp-username').value.trim() || '신규회원';
                const role = document.getElementById('inp-role').value;

                if (db.some(u => u.email === email)) {
                    showToast('⚠️ 데이터베이스 중복 오류: 이미 가입된 계정 메일 주소입니다.');
                    return;
                }

                db.push({ email, password, username, role });
                localStorage.setItem('BU_USERS_DB', JSON.stringify(db));
                showToast('🎉 스마트 멤버십 등록 성공! 세션 로그인을 시작해 주세요.');
                authFormMode = 'login';
                syncRouteView();
            } else {
                if(email === 'admin@uncle.com' && password === '1234') {
                    coreState.currentUser = { email, username: '삼척 관리자', role: 'admin' };
                } else if(email === 'customer@uncle.com' && password === '1234') {
                    coreState.currentUser = { email, username: '김토스 고객', role: 'customer' };
                } else {
                    const match = db.find(u => u.email === email && u.password === password);
                    if(match) {
                        coreState.currentUser = match;
                    } else {
                        showToast('❌ 원장 조회 오류: 계정 또는 비밀번호 코드를 확인해 주세요.');
                        return;
                    }
                }

                coreState.currentView = (coreState.currentUser.role === 'admin') ? 'dashboard' : 'timeline';
                showToast(`🔑 ${coreState.currentUser.username} 회원 세션 동기화 완료.`);
                syncRouteView();
            }
        }

        function executeLogout() {
            coreState.currentUser = null;
            showToast('🔒 오퍼레이션 세션이 해제되고 안전하게 로그아웃되었습니다.');
            syncRouteView();
        }

        function handleViewSwitch(viewId) {
            coreState.currentView = viewId;
            renderActiveSubView();
            // 모바일에서 탭 전환 시 화면 상단으로 포커스 부드럽게 고정
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function executeNewReservation() {
            const room = document.getElementById('sel-res-room').value;
            const checkIn = document.getElementById('inp-checkin-date').value;
            const checkOut = document.getElementById('inp-checkout-date').value;
            const guestName = document.getElementById('inp-guest-name').value.trim();

            if(!checkIn || !checkOut || !guestName) {
                showToast('❌ 날짜 지정과 대표 투숙자 성명 기입을 누락했습니다.');
                return;
            }

            if(new Date(checkIn) >= new Date(checkOut)) {
                showToast('❌ 일치성 위반: 퇴실일은 입실일보다 이후 시점이어야 합니다.');
                return;
            }

            const isOverlapped = coreState.reservations.some(res => {
                if (res.room !== room) return false;
                return (new Date(checkIn) < new Date(res.checkOut) && new Date(checkOut) > new Date(res.checkIn));
            });

            if (isOverlapped) {
                showToast('❌ 타임블록 선점 오류: 이미 해당 일정에 가동 중인 투숙 원장이 있습니다.');
                return;
            }

            const matchedRoomObj = coreState.rooms.find(x => x.id === room);
            const daysDiff = Math.ceil((new Date(checkOut) - new Date(checkIn)) / (1000 * 60 * 60 * 24));
            const calculatedPrice = matchedRoomObj.price * daysDiff;

            coreState.reservations.push({
                id: Date.now(),
                email: coreState.currentUser.email,
                room,
                checkIn,
                checkOut,
                guestName,
                price: calculatedPrice,
                status: '결제 완료'
            });

            showToast(`🎉 [${room.split(' ')[0]}] ${daysDiff}박 일정 가상 원장 등록 성공.`);
            renderActiveSubView();
        }

        function executeCancelReservation(id) {
            coreState.reservations = coreState.reservations.filter(x => x.id !== id);
            showToast('🗑️ 지정 투숙 스케줄 트랜잭션을 영구 취소 처리했습니다.');
            renderActiveSubView();
        }

        function executeRotateStatus(idx) {
            const current = coreState.rooms[idx].status;
            let next = 'empty';

            if (current === 'empty') {
                next = 'occupied';
                showToast(`📢 [${coreState.rooms[idx].id.split(' ')[0]}] 가상 체크인 처리 및 이용 중 전환`);
            } else if (current === 'occupied') {
                next = 'dirty';
                showToast(`📢 [${coreState.rooms[idx].id.split(' ')[0]}] 퇴실 판정 - 메이드 클리닝 정비 오더 발행`);
            } else if (current === 'dirty') {
                next = 'empty';
                showToast(`📢 [${coreState.rooms[idx].id.split(' ')[0]}] 정비 완결 보고 수신 - 입실 가능 공실 등급 마이그레이션`);
            }

            coreState.rooms[idx].status = next;
            renderActiveSubView();
        }

        function executeAddBbq() {
            const room = document.getElementById('sel-bbq-room').value;
            const item = document.getElementById('sel-bbq-item').value;
            const time = document.getElementById('inp-bbq-time').value;

            coreState.bbqOrders.push({ id: Date.now(), room, item, time, status: '접수 대기' });
            showToast('🔥 룸 컴플레인 현장 지원 오더를 정상 접수했습니다.');
            renderActiveSubView();
        }

        function executeClearBbq(id) {
            coreState.bbqOrders = coreState.bbqOrders.filter(o => o.id !== id);
            showToast('✅ 지정 현장 태스크를 종결하고 인스턴스를 처리 완료 소멸시켰습니다.');
            renderActiveSubView();
        }

        function executeForceKick(index) {
            let db = JSON.parse(localStorage.getItem('BU_USERS_DB')) || [];
            const target = db[index];

            if(coreState.currentUser && coreState.currentUser.email === target.email) {
                showToast('❌ 현재 자기 자신이 접속 중인 활성화 운영 계정은 자멸시킬 수 없습니다.');
                return;
            }

            db.splice(index, 1);
            localStorage.setItem('BU_USERS_DB', JSON.stringify(db));
            showToast('🗑️ CRM 저장 뱅크에서 타깃 유저 JSON 패킹 데이터 영구 파기 완결.');
            renderActiveSubView();
        }

        function showToast(msg) {
            const hub = document.getElementById('toast-hub');
            if(!hub) return;
            const t = document.createElement('div');
            t.className = "bg-tossGray900 text-white font-bold text-xs px-4 py-3 rounded-xl shadow-xl pointer-events-auto animate-screen-in flex items-center gap-2 border border-tossGray800 w-full";
            t.innerHTML = `<i class="fa-solid fa-circle-info text-tossBlue flex-shrink-0"></i><span class="truncate">${msg}</span>`;
            hub.appendChild(t);
            setTimeout(() => t.remove(), 2800);
        }

        window.onload = () => {
            let db = JSON.parse(localStorage.getItem('BU_USERS_DB')) || [];
            if(db.length === 0) {
                db.push({ email: 'admin@uncle.com', password: '1234', username: '삼척 관리자', role: 'admin' });
                db.push({ email: 'customer@uncle.com', password: '1234', username: '김토스 고객', role: 'customer' });
                localStorage.setItem('BU_USERS_DB', JSON.stringify(db));
            }
            syncRouteView();
        };
    </script>
</body>
</html>
